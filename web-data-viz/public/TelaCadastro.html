<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Amor entre patas</title>
    <link rel="icon" type="image/svg+xml" href="./assets/imgs/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/TelaCadastroCSS.css">
</head>

<body>

    <div class="conteiner">
        <img class="foto" src="https://i.pinimg.com/736x/cf/ae/7e/cfae7ee56f31b4ccf549665a04d628cd.jpg"
            alt="Foto cachorro">
    </div>


    <div class="topo">
        <div class="abas">
            <div class="bt_cadastro">
                <a href="./TelaCadastro.html">Cadastro</a>
            </div>

            <div class="bt_login">
                <a class="abas" href="./TelaLogin.html">Login</a>
            </div>
        </div>

        <div class="bt_voltar">
            <a href="./SiteHome.html">Voltar</a>
        </div>
    </div>

    <div class="titulo1">
        <h2>Se interessou pelo projeto? <br>
            venha fazer parte disso tambem!</h2>
    </div>

    <div class="titulo2">
        <span style="color: #df7a9c;">
            <h2>Cadastre-se</h2>
        </span> <br>
    </div>


    <div class="conteiner">
        <div class="formulario">

             <div class="campo-cpf">
                <div class="rotulo-cpf"> Nome:</div>
                <input class="campos" placeholder="Insira seu nome" id="ipt_nome"> <br>
            </div> <br>


            <div class="campo">
                <div class="rotulo">E-mail:</div>
                <input class="campos" placeholder="Insira seu e-mail" id="ipt_email">
            </div>

            <div class="campo">
                <div class="rotulo">Cpf:</div>
                <input class="campos" placeholder="Insira seu cpf" id="ipt_cpf">
            </div>

            <div class="campo">
                <div class="rotulo"> Senha:</div>
                <input class="campos" placeholder="Insira sua senha" type="password" id="ipt_senha">
            </div>

            <div class="campo">
                <div class="rotulo"> Confirmar senha:</div>
                <input class="campos" placeholder="Confirme sua senha" type="password" id="ipt_confirmarSenha"> <br>
            </div>


            <div class="btn-finalizar" onclick="validarCadastro()">
                <a href="javascript:void(0)">Cadastro</a>
            </div>

            <div id="div_exibir"></div>
        </div>
</body>

<script>
    function validarCadastro() {
        let tudoCerto = true;
        let mensagem = '';

        if (ipt_cpf.value == '' || ipt_cpf.value.length != 11) {
            tudoCerto = false;
            mensagem = 'Insira um CPF válido com 11 dígitos!';
            ipt_cpf.style.borderColor = '#E03131';
        } else {
            ipt_cpf.style.borderColor = '';
        }

        if (ipt_email.value == '' || !ipt_email.value.includes('@')) {
            tudoCerto = false;
            mensagem = 'Insira um e-mail válido!';
            ipt_email.style.borderColor = '#E03131';
        } else {
            ipt_email.style.borderColor = '';
        }

        if (ipt_nome.value == '') {
            tudoCerto = false;
            mensagem = 'Preencha o campo de nome!';
            ipt_nome.style.borderColor = '#E03131';
        } else {
            ipt_nome.style.borderColor = '';
        }

        if (ipt_senha.value == '') {
            tudoCerto = false;
            mensagem = 'Preencha o campo de senha!';
            ipt_senha.style.borderColor = '#E03131';
        } else {
            ipt_senha.style.borderColor = '';
        }

        if (ipt_confirmarSenha.value != ipt_senha.value || ipt_confirmarSenha.value == '') {
            tudoCerto = false;
            mensagem = 'As senhas não coincidem!';
            ipt_confirmarSenha.style.borderColor = '#E03131';
        } else {
            ipt_confirmarSenha.style.borderColor = '';
        }

        if (tudoCerto == true) {
            cadastrar();
        } else {
           div_exibir.innerHTML = mensagem;
        }
    }
function cadastrar() {
    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nomeServer: ipt_nome.value,
            cpfServer: ipt_cpf.value,
            emailServer: ipt_email.value,
            senhaServer: ipt_senha.value
        })
    }).then(function (resposta) {
        if (resposta.ok) {
            window.location = "TelaLogin.html";
        } else if (resposta.status == 409) {
            div_exibir.innerHTML = "";
        } else {
            div_exibir.innerHTML = "Não foi possível fazer o cadastro.";
        }
    });
}
</script>

</html>
