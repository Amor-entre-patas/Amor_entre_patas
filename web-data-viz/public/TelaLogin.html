<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Amor entre patas</title>
     <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/TelaLoginCSS.css">
</head>
<body>
    <div class="conteiner">
        <img class="foto" src="https://i.pinimg.com/736x/c0/55/c7/c055c74d54199c43bf8232326ab8dc46.jpg"
            alt="Foto gato">
    </div>


    <div class="topo">
        <div class="abas">
            <div class="bt_cadastro">
                <a href="./TelaCadastro.html">Cadastro</a>
            </div>

            <div class="bt_login">
                <a class="abas" href="./TelaLogin.html">Login</a>
            </div>
        </div>

        <div class="bt_voltar">
            <a href="./TelaCadastro.htmls">Voltar</a>
        </div>
    </div>

    <h2>Já faz parte do amor entre patas? <br></h2>

    <span style="color: #df7a9c;">
        <h2>efetue seu LOGIN</h2>
    </span> <br>


    <div class="conteiner">
        <div class="formulario">
           

            <div class="campo">
            <div class="rotulo">E-mail:</div>
            <input class="campos" placeholder="Insira seu e-mail" id="ipt_email">
            </div>

            <div class="campo">
            <div class="rotulo"> Senha:</div>
            <input class="campos" placeholder="Insira sua senha" type="password" id="ipt_senha">
            </div>


        <div class="btn-finalizar" onclick="cadastrar()"><a href="#">Login</a></div>


        <div id="div_exibir"></div>
    </div>
</body>
</html>
